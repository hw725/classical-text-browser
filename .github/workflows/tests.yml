# 올릴 때마다 빠른 시험 계층을 빈 Windows 서버에서 돌린다(D-144).
# main 보호의 필수 검사(job `fast`)다 — main 은 PR 로만 바뀌고 이 검사를 통과해야 병합된다(D-145).
# Windows인 이유: 사용자 PC와 같은 OS다. PYTHONUTF8 은 일부러 켜지 않는다 —
# 개발 PC는 켜 두어 cp949 사고가 가려지므로, 여기서 드러나게 한다.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 의존성 설치(uv.lock 그대로)
        run: uv sync --frozen

      # 시험 안에서 서고 저장소를 git 으로 만든다 — 빈 서버에는 커밋 작성자가 없다
      - name: git 작성자
        run: |
          git config --global user.name "ctb-ci"
          git config --global user.email "ctb-ci@users.noreply.github.com"

      - name: 빠른 시험(slow 제외)
        run: uv run --frozen python -m pytest -m "not slow" -q -p no:cacheprovider --timeout=120

      # 완료 영수증(scripts/receipt.py)의 나머지 단계 — CI 가 유일한 게이트라 같은 검사를 여기서 한다(D-145)
      - name: ruff
        run: uv run --frozen ruff check src/ tests/

      - name: 문서 드리프트
        run: uv run --frozen python scripts/check_doc_drift.py
