[project]
name = "classical-text-punctuation-service"
version = "0.1.0"
description = "고전한문 자동 표점 마이크로서비스 (SikuRoBERTa 기반)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

# 실제 모델 추론에 필요한 무거운 의존성은 분리.
# `uv sync --extra real` 시에만 설치된다.
# 본체와 의존성을 격리하기 위해 별도 pyproject로 두었다.
[project.optional-dependencies]
real = [
    "torch>=2.0",
    "transformers>=4.30",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["punctuation_service"]
