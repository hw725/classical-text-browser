[project]
name = "classical-text-browser"
version = "1.2.2"
description = "고전서지 통합 브라우저 — 사람과 LLM이 함께 고전 텍스트를 읽고 번역하고 연구하는 통합 작업 환경"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
# 하한 3.10은 그대로 둔다. 상한만 실제 제약에 맞춰 명시한다.
#
# 상한이 3.13 미만인 이유 — **paddlepaddle** 때문이다 (paddleocr가 아니다):
#   paddleocr  : 순수 파이썬, requires-python >=3.8 → 3.13에서도 설치된다.
#   paddlepaddle: 컴파일 패키지인데 휠이 cp310·cp311·cp312까지만 있다.
#                 3.13 휠이 없으므로 설치 자체가 불가능하다 (uv.lock 실측).
#                 GPU판(paddlepaddle-gpu)도 같은 범위다.
#
# paddlepaddle이 기본 의존성이 됐으니 이 제약이 프로젝트 전체에 걸린다.
# 상한을 적지 않으면 3.13 환경에서 «맞는 배포판을 못 찾았다»는 형태로
# 실패해 원인을 알기 어렵다. `.python-version`이 이미 3.12를 가리키고
# 있었으므로 실제로 쓰던 범위를 메타데이터에 옮겨 적는 것일 뿐이다.
#
# paddlepaddle이 3.13 휠을 내면 이 상한을 풀 수 있다.
requires-python = ">=3.10,<3.13"
authors = [
    { name = "hw725" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gitpython>=3.1.0",
    "jsonschema>=4.20.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "fpdf2>=2.8.5",
    "cssselect>=1.4.0",
    "pymupdf>=1.27.1",
    "pillow>=12.1.1",
    # 6.0.2로 하한을 둔 이유: paddleocr 3.7이 pyyaml==6.0.2를 고정한다.
    # 6.0.2와 6.0.3은 패치 릴리스라 이 프로젝트가 쓰는 API에 차이가 없다.
    "pyyaml>=6.0.2",
    "anthropic>=0.79.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "hwp-hwpx-parser>=1.0.0",
    "python-multipart>=0.0.22",
    "regex>=2026.2.19",
    # PaddleOCR — 기본 번들 (약 377MB).
    #
    # 왜 extra가 아니라 기본인가:
    #   OCR 산출물의 쓸모가 여기서 갈린다. PaddleOCR가 없으면 텍스트는 들어가되
    #   **줄 위치를 모른 채** 왼쪽 여백에 균등 배치된다. 검색은 되지만 형광
    #   표시가 글자가 없는 자리에 뜬다(실측: 502줄 중 433줄이 제자리 → 0줄).
    #   "설치 안내를 따랐는데 형광이 엉뚱한 곳에 뜬다"는 상태를 기본값으로
    #   두지 않는다. 용량은 크지만 한 번 치르는 비용이다.
    #
    #   읽기(인식)는 LLM Vision이 하고 PaddleOCR는 **검출(위치)** 만 맡는다.
    #   검출은 언어와 무관하므로 한글·한자 혼용 문헌에도 그대로 쓸 수 있다.
    #
    # 기본은 **CPU판**이다. GPU판(paddlepaddle-gpu)으로 바꾸면 검출·인식이
    # 쪽당 52.1초 → 1.0초가 되지만(실측 2026-08-12, RTX 3070 Ti Laptop, 200DPI),
    # 설치가 828MB → 약 4.3GB가 된다(paddle 1,077MB + nvidia-* 2,708MB 실측).
    # 그 덩치는 `classical-gpu` extra(+4.5GB)와 맞먹는다. 이 저장소는 GPU 스택을
    # 언제나 선택으로 두어 왔으므로 기본값으로 올리지 않는다.
    # 바꾸는 절차는 docs/user-guide.md의 「PaddleOCR를 GPU로 돌리기」에 있다.
    "paddlepaddle>=3.3.1",
    "paddleocr>=3.7.0",
    "setuptools",  # paddle.utils.cpp_extension이 import한다 (3.12에는 기본 포함이 아니다)
]


# PaddleOCR 운영 주의 (기본 의존성으로 들어 있다)
#
# Windows — OneDNN을 꺼야 한다:
#   paddlepaddle 3.x는 Windows에서 OneDNN 경로가 PIR 속성 변환을 지원하지 않아
#   `ConvertPirAttribute2RuntimeAttribute` 오류로 추론이 실패한다(실측 2026-07-25).
#   src/ocr/paddleocr_engine.py가 FLAGS_use_mkldnn=0 을 설정해 이를 회피한다.
#
# 인식 언어의 한계 (실측 2026-07-25, 국한문 혼용 논문 1쪽):
#   lang="korean"      → 한글 479자, **한자 0자**
#   lang="chinese_cht" → 한자 202자, **한글 0자**
#   두 모델은 상보적이라 국한문 혼용 문헌은 어느 하나로도 읽을 수 없다.
#   그래서 이 저장소는 PaddleOCR를 **검출(위치)** 용도로 쓰고
#   인식은 LLM Vision에 맡기는 조합을 기본으로 삼는다.

# 콘솔 명령. 설치하면 `ctb ocr 논문.pdf` 로 쓸 수 있다.
#
# 왜 두는가: `uv run python -m cli ocr ...`는 «파이썬 모듈을 실행한다»는
# 사정을 사용자가 알아야 하는 형태다. 이 저장소의 사용자는 비개발자
# 연구자이고, 논문 한 편을 처리하려는 사람에게 그 사정은 군더더기다.
[project.scripts]
ctb = "cli.__main__:main"

# ─────────────────────────────────────────────────────────────
#  선택 설치 (extra) — 없어도 근현대 한글 논문 처리는 전부 된다
#
#  이름을 용도로 지은 이유: 세 엔진을 엔진 이름으로만 늘어놓으면 «오프라인 OCR»로
#  뭉뚱그려 읽혀, 한글 논문을 하려는 사람이 **한글을 못 읽는** 고전적 전용 엔진을
#  고르게 된다. 무엇에 쓰는 것인지가 이름에서 보여야 한다.
#  엔진 이름(NDLOCR-Lite 등)은 문서에서 함께 밝힌다 — CC BY 4.0 출처 표기 의무.
#
#  opencv는 **반드시 contrib 배포판**을 쓴다. paddlex(기본 의존성 paddleocr가
#  끌어온다)가 opencv-contrib-python을 요구하는데, 여기에 opencv-python-headless를
#  더하면 같은 `cv2` 패키지를 두 배포판이 제공하게 된다. 그 상태에서 한쪽을 지우면
#  공유 디렉터리가 통째로 사라져 남은 쪽까지 깨진다
#  (실측 2026-07-26: `module 'cv2' has no attribute 'IMREAD_COLOR'`).
# ─────────────────────────────────────────────────────────────
[project.optional-dependencies]

# 일본어 문헌 (근현대) — NDLOCR-Lite. 약 170MB.
# ONNX 기반 오프라인 OCR. 한문(CJK 한자)/일본어 전용, **한글 미지원**.
# 원본: https://github.com/ndl-lab/ndlocr-lite (CC BY 4.0, National Diet Library, Japan)
japanese = [
    "onnxruntime>=1.20.0",
    "opencv-contrib-python>=4.8.0",  # headless판과 섞지 말 것 — 아래 주석 참조
    "networkx>=3.0",
    "ordered-set>=4.1.0",
    "tqdm>=4.60.0",
]

# 고서(古典籍) — NDL古典籍OCR-Lite. 약 170MB.
# 변체가나·고서체·한문 특화. 근현대 논문에는 쓰지 않는다(한글 미지원).
# 원본: https://github.com/ndl-lab/ndlkotenocr-lite (CC BY 4.0, National Diet Library, Japan)
classical = [
    "onnxruntime>=1.20.0",
    "opencv-contrib-python>=4.8.0",  # headless판과 섞지 말 것 — 아래 주석 참조
    "networkx>=3.0",
    "ordered-set>=4.1.0",
    "tqdm>=4.60.0",
]

# 고서 — 최고 품질 (TrOCR). CUDA GPU 권장.
#
# 용량 주의: **약 4.5GB**다(실측 2026-07-26, torch 2.6+cu124).
# Windows는 CUDA 런타임이 별도 nvidia-* 패키지가 아니라 `torch/lib` 안에
# 통째로 들어간다 — 그 폴더 하나가 4,359MB다.
# Linux도 torch 1,550 + nvidia-* 2,742 + triton 440 ≈ 4.7GB로 비슷하다.
# 원본: https://github.com/ndl-lab/ndlkotenocr_cli (CC BY 4.0, National Diet Library, Japan)
classical-gpu = [
    # 상한 <2.8인 이유 — paddlepaddle-gpu와 nvidia-* 런타임 핀을 맞추기 위해서다.
    # torch 2.7.x+cu126은 nvidia-cublas-cu12==12.6.4.1 계열(paddle과 동일)을 쓰지만,
    # 2.13+cu126은 Windows에서도 nvidia-* pip 패키지를 쓰면서 더 새 버전을 고정해
    # paddle의 cudnn DLL 로드가 WinError 127로 죽는다 (실측 2026-08-20).
    "torch>=2.6.0,<2.8",
    "torchvision>=0.21.0",
    "transformers>=4.47.0",
    "onnxruntime>=1.20.0",
    "opencv-contrib-python>=4.8.0",  # headless판과 섞지 말 것 — 아래 주석 참조
    "networkx>=3.0",
    "ordered-set>=4.1.0",
    "tqdm>=4.60.0",
]

# ── 예전 이름 (하위 호환) ─────────────────────────────
# 문서와 스크립트에 흩어져 있던 이름이라 남겨 둔다. 새로 쓸 때는 위 이름을 쓴다.
# paddleocr은 기본 의존성이 됐으므로 이 extra는 아무것도 더 설치하지 않는다.
ndlocr = ["classical-text-browser[japanese]"]
ndlkotenocr = ["classical-text-browser[classical]"]
ndlkotenocr-full = ["classical-text-browser[classical-gpu]"]
paddleocr = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/parsers", "src/cli", "src/app", "src/ocr", "src/llm", "src/hwp", "src/text_import", "src/export"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "src/ocr/ndlocr",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── PyTorch CUDA 인덱스 설정 ──
# torch/torchvision은 CUDA 빌드를 PyTorch 전용 인덱스에서 가져온다.
# explicit = true → 이 인덱스는 torch/torchvision만 사용 (다른 패키지는 PyPI에서).
#
# CUDA 인덱스는 플랫폼별로 갈린다 (2026-08-20 실측, D-078 후속).
#
#   Linux  → cu126: torch 2.7.x+cu126의 nvidia-* 핀(nvidia-cublas-cu12==12.6.4.1)이
#            paddlepaddle-gpu 3.3.1과 정확히 일치해, 한 환경에서 두 스택의
#            의존성 해석이 성립한다. (cu124 시절엔 ==12.4.5.8 vs ==12.6.4.1로
#            «No solution found»)
#   Windows → cu124: torch 2.6.x+cu124는 CUDA DLL을 휠에 동봉해 nvidia-* 패키지를
#            쓰지 않으므로 paddle과 부딪힐 공유 층 자체가 없다 — 공존 실증됨.
#            cu126 통일도 시도했으나(2.7·2.13) Windows에서는 torch도 nvidia-*
#            패키지를 쓰는데 그 cudnn(9.5·9.10·9.24 모두 시험)을 paddle이
#            WinError 127로 로드하지 못했다. Windows에서 cu126 통일은 불가.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu126", marker = "sys_platform != 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu126", marker = "sys_platform != 'win32'" },
]
