[project]
name = "classical-text-browser"
version = "1.1.5"
description = "고전서지 통합 브라우저 — 사람과 LLM이 함께 고전 텍스트를 읽고 번역하고 연구하는 통합 작업 환경"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
authors = [
    { name = "hw725" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gitpython>=3.1.0",
    "jsonschema>=4.20.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "fpdf2>=2.8.5",
    "cssselect>=1.4.0",
    "pymupdf>=1.27.1",
    "pillow>=12.1.1",
    # 6.0.2로 하한을 둔 이유: paddleocr 3.7이 pyyaml==6.0.2를 고정한다.
    # 6.0.2와 6.0.3은 패치 릴리스라 이 프로젝트가 쓰는 API에 차이가 없다.
    "pyyaml>=6.0.2",
    "anthropic>=0.79.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "hwp-hwpx-parser>=1.0.0",
    "python-multipart>=0.0.22",
    "regex>=2026.2.19",
]

# PaddleOCR 선택 설치(extra): uv sync --extra paddleocr
#
# 왜 Python 3.12를 쓰는가 (.python-version 참조):
#   PaddleOCR는 Python 3.13에서 설치·동작이 확인되지 않는다. 3.12로 맞췄다.
#
# Windows 주의 — OneDNN을 꺼야 한다:
#   paddlepaddle 3.x는 Windows에서 OneDNN 경로가 PIR 속성 변환을 지원하지 않아
#   `ConvertPirAttribute2RuntimeAttribute` 오류로 추론이 실패한다(실측 2026-07-25).
#   src/ocr/paddleocr_engine.py가 FLAGS_use_mkldnn=0 을 설정해 이를 회피한다.
#
# 인식 언어 주의 (실측 2026-07-25, 국한문 혼용 논문 1쪽):
#   lang="korean"      → 한글 479자, **한자 0자**
#   lang="chinese_cht" → 한자 202자, **한글 0자**
#   두 모델은 상보적이라 국한문 혼용 문헌은 어느 하나로도 읽을 수 없다.
#   그래서 이 저장소는 PaddleOCR를 **검출(위치)** 용도로 쓰고
#   인식은 LLM Vision에 맡기는 조합을 지원한다.
[project.optional-dependencies]
paddleocr = [
    "paddlepaddle>=3.3.1",
    "paddleocr>=3.7.0",
    "setuptools",  # paddle.utils.cpp_extension이 import한다 (3.12에는 기본 포함이 아니다)
]
# NDLOCR-Lite 선택 설치(extra): uv sync --extra ndlocr
# ONNX 기반 오프라인 OCR — 한문(CJK 한자)/일본어 전용. 한글 미지원.
# Python 3.10+ 호환. PaddleOCR을 설치하지 않을 때의 오프라인 대안.
# 원본: https://github.com/ndl-lab/ndlocr-lite (CC BY 4.0, National Diet Library, Japan)
ndlocr = [
    "onnxruntime>=1.20.0",
    "opencv-python-headless>=4.8.0",
    "networkx>=3.0",
    "ordered-set>=4.1.0",
    "tqdm>=4.60.0",
]
# NDL古典籍OCR-Lite 선택 설치(extra): uv sync --extra ndlkotenocr
# ONNX 기반 오프라인 OCR — 고전적(古典籍) 전용. 변체가나/고서체/한문 특화.
# ndlocr과 의존성 동일. uv sync --extra ndlocr 했으면 추가 설치 불필요.
# 원본: https://github.com/ndl-lab/ndlkotenocr-lite (CC BY 4.0, National Diet Library, Japan)
ndlkotenocr = [
    "onnxruntime>=1.20.0",
    "opencv-python-headless>=4.8.0",
    "networkx>=3.0",
    "ordered-set>=4.1.0",
    "tqdm>=4.60.0",
]
# NDL古典籍OCR Full (TrOCR) 선택 설치: uv sync --extra ndlkotenocr-full
# PyTorch + HuggingFace TrOCR 기반. CUDA GPU 권장 (CPU도 동작하나 느림).
# RTMDet ONNX 레이아웃은 ndlocr/ndlkotenocr extra와 의존성 공유.
# 원본: https://github.com/ndl-lab/ndlkotenocr_cli (CC BY 4.0, National Diet Library, Japan)
ndlkotenocr-full = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.47.0",
    "onnxruntime>=1.20.0",
    "opencv-python-headless>=4.8.0",
    "networkx>=3.0",
    "ordered-set>=4.1.0",
    "tqdm>=4.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/parsers", "src/cli", "src/app", "src/ocr", "src/llm", "src/hwp", "src/text_import", "src/export"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "src/ocr/ndlocr",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── PyTorch CUDA 인덱스 설정 ──
# torch/torchvision은 CUDA 빌드를 PyTorch 전용 인덱스에서 가져온다.
# explicit = true → 이 인덱스는 torch/torchvision만 사용 (다른 패키지는 PyPI에서).
# CUDA 12.4 기준. 다른 CUDA 버전이 필요하면 URL의 cu124를 변경.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
